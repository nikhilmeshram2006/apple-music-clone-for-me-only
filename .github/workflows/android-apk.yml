name: Build AUREL Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Prepare AUREL.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AUREL.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUREL-apk
          path: AUREL.apk

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: AUREL Android App (Latest)
          body: |
            Native AUREL Android App wrapping `https://aurel.antideploy.app/` with native background playback, lock-screen media controls, and direct **Bluetooth ↔ Phone Speaker** hardware audio output switching.
          files: AUREL.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
